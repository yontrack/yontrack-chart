# Default values for ontrack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  # -- Image to use for Yontrack (backend)
  repository: yontrack/yontrack
  # -- Pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

# -- List of secrets used to pull images
imagePullSecrets: [ ]

# -- When false (default), omits `helm.sh/chart` and `app.kubernetes.io/version` from all resource labels.
# Enable when you want standard Kubernetes recommended labels for observability/filtering.
# Keeping this false avoids noisy diffs in GitOps rendered-manifest workflows.
includeVersionLabels: false
# -- Name to use instead of the chart name
nameOverride: ""
# -- If defined, uses this name for the resource names instead of the using the chart name
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: { }
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations for all pods
podAnnotations: { }

# -- Security context for all pods
podSecurityContext: { }

# -- Security context for the containers
securityContext: { }
  # capabilities:
  #   drop:
  #   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# -- Global configuration for all sub-charts
global:
  # -- Configuration for OpenShift
  compatibility:
    openshift:
      # -- Whether to adapt the security context for OpenShift
      adaptSecurityContext: auto

service:
  # -- Service type for the Yontrack service.
  # Must be ClusterIP unless `management.service.specific` is true, since the management port must never be exposed outside the cluster.
  type: ClusterIP
  # -- Exposed port for the Yontrack service
  port: 8080
  # -- Annotations for the Yontrack service
  annotations: { }

# The management port (8800) serves unauthenticated endpoints (health, metrics): the chart never routes it
# through the Ingress and fails to render any Service exposing it outside the cluster (checked by scripts/test-templates.sh).
management:
  service:
    # -- Exposed port for the Yontrack management service. Must be different from `service.port`.
    port: 8800
    # -- Set to true to have the management port exposed by another Service. By default, using the same service and two different named ports.
    # Required to use a `service.type` other than ClusterIP, since the management port must never be exposed outside the cluster.
    specific: false
    # -- Annotations for the management service. Only used when specific == true
    annotations: { }
    # -- Service type for the management. Only used when specific == true.
    # Must be ClusterIP: the management port must never be exposed outside the cluster.
    type: ClusterIP

ingress:
  # -- Creating an Ingress for the Yontrack different services. This is required when using Keycloak.
  enabled: true
  # -- Ingress class name
  ingressClassName: ""
  # -- Annotations for the Ingress
  annotations: {}
  # -- Host for Yontrack
  host: "ontrack.local"
  tls:
    # -- Using TLS for Yontrack
    enabled: true
    # -- Name of the secret containing the TLS certificate
    # If not provided, defaults to <host>-tls
    secretName: ""

# -- Node selectors for the Yontrack resources
nodeSelector: {}

# -- Node tolerations for the Yontrack resources
tolerations: []

# -- Node affinity for the Yontrack resources
affinity: {}

# -- Configuration for OpenShift
openshift:
  # -- Whether to enable OpenShift specific resources (like Routes)
  enabled: false

# -- General configuration of the init containers
initContainers:
  # -- Configuration of the image used for the init containers
  image:
    # -- Image repository (including the registry)
    repository: busybox
    # Image tag
    tag: 1.37.0
  # -- Resources for the init containers of Yontrack
  resources:
    limits:
      # -- CPU limits for the init containers
      cpu: 100m
      # -- Memory limits for the init containers
      memory: 50Mi
    requests:
      # -- CPU request for the init containers
      cpu: 100m
      # -- Memory request for the init containers
      memory: 50Mi

# Yontrack configuration
ontrack:
  # -- Yontrack root URL - must point to the UI service
  url: "http://localhost:3000"
  # -- Comma-separated list of active Spring profiles
  profiles: prod
  # -- Application configuration file as a YAML content
  application_yaml: ""
  # Next UI setup
  ui:
    # -- Number of replicas for the UI (experimental)
    replicas: 1
    # -- Image to use for the UI
    image: yontrack/yontrack-ui
    # Service
    service:
      # -- Exposed port for the Yontrack IO
      port: 3000
    # -- Next UI resources
    resources:
      limits:
        # -- Next UI resources
        cpu: 800m
        # -- Next UI resources
        memory: 1Gi
      requests:
        # -- Next UI resources
        cpu: 800m
        # -- Next UI resources
        memory: 1Gi
    # -- Annotations for the Yontrack UI pod
    podAnnotations: { }
    # -- UI configuration
    config:
      # -- Using the custom signin page
      customSignin: true
  ## Adjust these values to your needs, but make sure that the memory limit is never under 4 GB
  resources:
    limits:
      # -- Yontrack resources
      cpu: 800m
      # -- Yontrack resources
      memory: 2Gi
    requests:
      # -- Yontrack resources
      cpu: 800m
  # -- Probes configuration
  probes:
    # -- Startup probe configuration. The startup budget is `initialDelaySeconds` + `failureThreshold` × `periodSeconds` (390 s by default): the first start runs all the database migrations.
    startup:
      # -- Initial delay at startup
      initialDelaySeconds: 30
      # -- Probe interval at startup
      periodSeconds: 10
      # -- Timeout of each startup probe
      timeoutSeconds: 5
      # -- Failure threshold at startup
      failureThreshold: 36
    # -- Liveness probe configuration
    liveness:
      # -- Initial delay of the liveness probe
      initialDelaySeconds: 60
      # -- Liveness probe interval
      periodSeconds: 60
      # -- Timeout of each liveness probe
      timeoutSeconds: 5
      # -- Failure threshold of the liveness probe
      failureThreshold: 3
    # -- Readiness probe configuration
    readiness:
      # -- Initial delay of the readiness probe
      initialDelaySeconds: 60
      # -- Readiness probe interval
      periodSeconds: 60
      # -- Timeout of each readiness probe
      timeoutSeconds: 5
      # -- Failure threshold of the readiness probe
      failureThreshold: 3
  # -- Annotations for the Yontrack pod
  podAnnotations: { }
  # Persistence configuration
  persistence:
    # -- Enabling the persistent storage
    enabled: true
    # -- Set annotations on pvc
    annotations: { }
    # -- PVC access mode
    accessMode: ReadWriteOnce
    # -- PVC initial size
    size: 5Gi
    # -- If defined, storageClassName: <storageClass>
    # If set to "-", storageClassName: "", which disables dynamic provisioning
    # If undefined (the default) or set to null, no storageClassName spec is
    #   set, choosing the default provisioner.  (gp2 on AWS, standard on
    #   GKE, AWS & OpenStack)
    storageClass:
  # Yontrack configuration properties
  config:
    # -- Using the database to store the key by default
    key_store: jdbc
    # If key_store == "secret"
    secret_key_store:
      # -- Name of the secret
      secret_name: "ontrack-key-store"
      # -- Directory to use inside the container
      directory: "/var/ontrack/key_store"
      # -- Using an external secret
      external:
        # -- Activate the creation of the External secret
        enabled: false
        # -- Refresh interval
        refreshInterval: 6h
        # -- Location of the secret to bind to
        store:
          # -- Name of the secret store
          name: vault-backend
          # -- Scope of the secret store
          kind: ClusterSecretStore
          # -- Path to the secret in the store.
          path: ontrack/encryption
          # -- Name of the key in the external secret
          key: key
    # License management
    license:
      # -- Provided license key
      # An evaluation key is provided by default (valid until 2025-12-31, up to 10 projects, no extra features)
      key: ""
  # Management configuration
  management:
    metrics:
      # Tags to add to all exposed metrics
      tags:
        # -- Application tag to add to all exposed metrics
        application: "ontrack"

  # -- Arbitrary environment variables, using https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.35/#envvar-v1-core
  env: [ ]
  # -- Arbitrary environment variables (as a map)
  envMap: {}

  # Arbitrary secrets & config map sources
  extraConfig:
    # -- Arbitrary secrets map sources
    secrets: [ ]
    # secrets:
    #   - secret-name
    # -- Arbitrary config map sources
    configmaps: [ ]
    # configmaps:
    #   - config-map-name

  # -- CasC configuration
  casc:
    # -- Is Casc enabled?
    enabled: true
    # -- Config map containing all Casc files
    map: ""
    # -- Secret map containing all secret Casc files
    secret: ""
    # -- Path where to mount the Casc files
    directory: "/var/ontrack/casc"
    # -- Mapping of secrets
    secrets:
      # -- Secret mapping mode
      mapping: env
      # -- Directory where to map the secrets (for mapping = env)
      directory: "/var/ontrack/casc/mapping"
      # -- List of secret names to mount
      names: []
    # -- List of external secrets to declare
    externalSecrets:
      # -- Enabling the creation of the external secret
      enabled: false
      # -- Refresh interval
      refreshInterval: 6h
      # -- Location of the secret to bind to
      store:
        # -- Name of the secret store
        name: vault-backend
        # -- Scope of the secret store
        kind: ClusterSecretStore
      # -- Name of the secret to create
      secretName: ontrack-casc-secrets
      # -- List of secret keys to create
      secretKeys: []
      #    # -- Path to the secret in the backend
      #  - path: ontrack/casc/secrets
      #    # -- Key in the backend secret to use
      #    sourceKey: key
      #    # -- Key in the target secret to create
      #    targetKey: key
    # -- Auto reload configuration
    reloading:
      # -- Auto reload activation
      enabled: false
      # -- Auto reload cron schedule
      # Leave empty to be a manual job only
      cron: ""
    # -- Uploading the Casc
    upload:
      # -- Casc upload activation
      enabled: false
    # -- Casc from values
    mapValues:
      # -- Enabling the creating & mapping of a config map holding Casc values
      # Casc values are expected to be under the root `casc` object, for example
      # casc:
      #   ontrack:
      #     # ...
      # -- Name of the entry to hold the values
      mapEntryName: "casc.yaml"

# -- Authentication
auth:
  # -- Type of authentication
  kind: keycloak
  # -- Provisioning of groups & initial administrator
  provisioning: true
  # -- Configuration of the initial administrator
  admin:
    # -- Their email
    email: "admin@ontrack.local"
    # -- Their full name (if not provided)
    fullName: "Administrator"
    # -- Group of administrators
    groupName: "Administrators"
    # -- Force the creation/update of the administrator user even if it already exists
    force: false
  # -- OIDC configuration (disabled by default)
  oidc:
    # -- Display name for your IdP (used for the login page)
    name: OIDC
    # -- OIDC scope
    scope: "openid profile email"
    # -- OIDC issuer URL
    issuer: ""
    # -- Trailing slash for the issuer URL (used for Auth0)
    trailingSlash: false
    # -- Credentials used to contact the OIDC provider
    credentials:
      # -- Either stored in a secret (recommended)
      secret:
        # -- Enabling the secret
        enabled: true
        # -- The secret is expected to have the following keys: clientId & clientSecret
        secretName: ontrack-oidc
        # -- Depending on your setup, you can also just create an external secret
        # definition, pointing to the actual secret in a secret provided like
        # Vault or your cloud secret manager
        # If not using an external secret, Yontrack expects you to create the
        # secret manually.
        externalSecret:
          # -- Enabling the creation of the external secret
          enabled: false
          # -- Refresh interval
          refreshInterval: 6h
          # -- Location of the secret to bind to
          store:
            # -- Name of the secret store
            name: vault-backend
            # -- Scope of the secret store
            kind: ClusterSecretStore
            # -- Path to the secret in the store.
            # The entry is expected to have the following keys: clientId & clientSecret
            path: ontrack/oidc
      # -- ... or provided directly in the values (ok for testing)
      # If a secret (or external secret) is provided, these values are not used
      client:
        # -- OIDC Client ID
        clientId: <client id>
        # -- OIDC Client Secret
        clientSecret: <client secret>
  # -- Configuration of the local Keycloak instance
  keycloak:
    # -- Name to use on the Signin page
    name: Yontrack
    # -- Name of the Keycloak client
    clientName: yontrack-client
    # -- Image of Keycloak to deploy
    image: quay.io/keycloak/keycloak
    # -- Version this image of Keycloak to deploy
    tag: 26.2.5
    # -- Starting the server in verbose mode
    verbose: false
    # -- Log level for the local Keycloak instance
    logLevel: INFO
    # -- Admin user for the admin console of Keycloak
    bootstrap:
      # -- Username to connect to Bootstrap. Prefer using a secret.
      username: admin
      # -- Password to connect to Bootstrap. Prefer using a secret.
      password: admin
      # -- Secret for the bootstrapping
      bootstrapSecret:
        # -- Enabling using a secret
        enabled: false
        # -- Secret name
        secretName: ontrack-keycloak-bootstrap
        # -- Secret key for the username
        usernameKey: username
        # -- Secret key for the password
        passwordKey: password
        # -- Generating the secret (the password only, keeping the username)
        generate: true
        # -- Using an external secret
        externalSecret:
          # -- Creating the external secret definition
          enabled: false
          # -- Refresh interval
          refreshInterval: 6h
          # -- Location of the secret to bind to
          store:
            # -- Name of the secret store
            name: vault-backend
            # -- Scope of the secret store
            kind: ClusterSecretStore
            # -- Path to the secret in the store.
            # The entry is expected to have the following keys: bindDn & bindCredential
            path: ontrack/keycloak/bootstrap
            # -- Username key
            usernameKey: username
            # -- Password key
            passwordKey: password
    # -- If using an external Keycloak instance
    external:
      # -- Enabling an external Keycloak instance
      enabled: false
      # -- URL to the external Keycloak instance
      url: https://keycloak
    # -- Service setup for the local Keycloak instance
    service:
      # -- Port of the service for the local Keycloak instance
      port: 8080
      # -- Relative path for the local Keycloak instance (relatively to the Yontrack main URL)
      path: keycloak
      # -- Enabling Keycloak in the Ingress
      ingressEnabled: true
    # -- Resources to allocate to the local Keycloak instance
    resources: {}
    # -- Name of the realm to create in Keycloak to serve the Yontrack users
    realm: ontrack
    # -- Provisioning settings
    settings:
      # -- Provisioning of Keycloak is enabled
      enabled: true
      # -- Enabling users to register in the local instance of Keycloak
      registrationAllowed: true
      # -- Enabling users to reset their passwords
      resetPasswordAllowed: true
      # -- SSO idle time (in seconds)
      ssoSessionIdleTimeout: 3600
      # -- Access Token Lifespan (in seconds)
      accessTokenLifespan: 3600
      # -- Names of the groups to create in the realm, carried in the `groups` claim.
      # Not compatible with `auth.keycloak.ldap`. See `users` for existing installations.
      groups: []
      # -- Users to create in the realm, next to the `admin` user. Not compatible with `auth.keycloak.ldap`.
      # Each user needs a `username`, an `email`, a `firstName`, a `lastName`, the `groups` it belongs to (declared in `groups`)
      # and a `passwordSecret` (`name` & `key` of an existing secret containing its password, which must not contain `"` nor `\`).
      # Passwords are never in the values nor in the rendered realm.
      # On an existing installation, a post-install/post-upgrade job adds the missing groups & users to the realm:
      # existing groups & users are left untouched (their passwords & groups are not updated).
      users: []
      # -- Initial Yontrack user to create
      admin:
        # -- Enabling the provisioning of the admin user
        enabled: true
        # -- Email
        # If not set, `auth.admin.email` is used
        email: ""
        # -- First name
        firstName: "Admin"
        # -- Last name
        lastName: "User"
        # -- Username
        username: "admin"
        # -- Password (would need to be changed)
        password: "admin"
        # -- Fetching the admin user from a secret
        secret:
          # -- Using a secret to store the admin credentials (username & password keys)
          enabled: false
          # -- Name of the secret to use
          name: yontrack-admin
          # -- External secret for the admin credentials
          external:
            # -- Creating the external secret definition
            enabled: false
            # -- Refresh interval
            refreshInterval: 6h
            # -- Location of the secret to bind to
            store:
              # -- Name of the secret store
              name: vault-backend
              # -- Scope of the secret store
              kind: ClusterSecretStore
              # -- Path to the secret in the store.
              path: ontrack/keycloak/admin
              # Username key
              usernameKey: username
              # Password key
              passwordKey: password
    # -- Connection parameters to Keycloak stored in a secret
    secret:
      # -- Using a secret to store the client secret
      enabled: false
      # -- Name of the secret to use
      name: ontrack-keycloak
      # -- Generating the client secret
      generate: true
      # -- External secret for the client secret
      external:
        # -- Creating the external secret definition
        enabled: false
        # -- Refresh interval
        refreshInterval: 6h
        # -- Location of the secret to bind to
        store:
          # -- Name of the secret store
          name: vault-backend
          # -- Scope of the secret store
          kind: ClusterSecretStore
          # -- Path to the secret in the store.
          path: ontrack/keycloak/client
          # Key in the external store
          key: client-secret
    # -- Connection parameters to Keycloak
    client:
      # -- Client ID
      id: yontrack-client
      # -- Value of the client secret - should not be used in production
      secret: yontrack-client-secret
    # -- Account management from Yontrack
    account:
      # -- If set to not blank, URL to allow users to manage their own account
      url: http://localhost:8008/realms/ontrack/account
    # -- Configuration of Keycloak to use a LDAP for user federation
    ldap:
      # -- Using a LDAP
      enabled: false
      # -- If defined, provides the _whole_ LDAP configuration in Keycloak (under the `components` node)
      components: {}
      # -- ID of the LDAP federation in Keycloak
      id: ldap-users
      # -- Name of the LDAP federation in Keycloak
      name: ldap-users
      # -- Vendor name
      vendor: other
      # -- URL to the ldap
      url: ldap://ldap:389
      # -- Users DN
      usersDn: ou=users,dc=example,dc=com
      # -- Bind DN
      # Prefer using a secret
      bindDn: cn=admin,dc=example,dc=com
      # -- Bind credentials
      # Not recommended in production, better use a secret
      bindCredential: admin
      # -- Bind credentials in a secret
      bindCredentialSecret:
        # -- Using a secret to store the credentials
        enabled: false
        # -- Name of the secret
        # This secret is expected to have the following keys:
        # * bindDn
        # * bindCredential
        secretName: ontrack-ldap-credentials
        # -- Using an external secret
        externalSecret:
          # -- Creating the external secret definition
          enabled: false
          # -- Refresh interval
          refreshInterval: 6h
          # -- Location of the secret to bind to
          store:
            # -- Name of the secret store
            name: vault-backend
            # -- Scope of the secret store
            kind: ClusterSecretStore
            # -- Path to the secret in the store.
            # The entry is expected to have the following keys: bindDn & bindCredential
            path: ontrack/keycloak/ldap
      # -- LDAP attributes: username
      usernameLDAPAttribute: uid
      # -- LDAP attributes: DN
      rdnLDAPAttribute: uid
      # -- LDAP attributes: unique ID
      uuidLDAPAttribute: entryUUID
      # -- LDAP attributes: class for the user object
      userObjectClasses: ["inetOrgPerson"]
      # -- Search scope for the users
      # 1: One Level
      # 2: Subtree
      searchScope: 1
      # -- Configuration of the LDAP groups
      groups:
        # -- Groups DN
        groupsDn: "ou=groups,dc=example,dc=com"
        membershipAttributeType: DN
        membershipUserLdapAttribute: uid
        membershipLdapAttribute: member
        memberofLdapAttribute: memberOf
        groupNameLdapAttribute: cn
        groupObjectClasses: groupOfNames
      # -- Mappers configurations
      mappers:
        # -- `groups` mapper
        groups:
          # -- Preserve group inheritance
          preserveGroupInheritance: true
        # -- Mapping of the full name
        name:
          # -- Enabling the mapper
          enabled: true
          # -- LDAP attribute containing the full name
          attribute: name
      # -- Creating a testing LDAP instance
      testing:
        # -- Enabling the creation of the LDAP test instance
        enabled: false
        # -- Image to be used for the LDAP service
        image: osixia/openldap
        # -- Tag to be used for the LDAP service
        tag: 1.5.0
        # -- Admin user
        admin:
          # -- Its password
          password: admin
        # -- Resources to allocate
        resources: {}
        # -- Provisioning of the LDAP
        provisioning:
          # -- Is it enabled?
          enabled: true
          # -- Organization name
          organisation: Yontrack
          # -- Domain name
          domain:
            extension: com
            name: yontrack
          # -- Admin user
          admin:
            # -- SSHA admin password
            # `slappasswd -h {SSHA} -s admin`
            sshaPassword: "{SSHA}cqhYu0IJNPgwklQuoENm6PtzGJLpPkgt"
    # -- Persistence options for Keycloak
    persistence:
      # -- PVC setup
      pvc:
        # -- Annotations for the PVC
        annotations: {}
        # -- PVC access mode
        accessMode: ReadWriteOnce
        # -- Disk size
        size: 5Gi
        # -- If defined, storageClassName: <storageClass>
        # If set to "-", storageClassName: "", which disables dynamic provisioning
        # If undefined (the default) or set to null, no storageClassName spec is
        #   set, choosing the default provisioner.  (gp2 on AWS, standard on
        #   GKE, AWS & OpenStack)
        storageClass:
      # -- Image for Postgres
      image:
        # -- Image repository
        repository: bitnamilegacy/postgresql
        # -- Image tag
        tag: 17
        # -- Pull policy
        pullPolicy: IfNotPresent
      # -- Resources to allocate to Postgres
      resources: {}
      # -- Connection parameters
      connection:
        # -- Database name
        database: keycloak
        # -- Username
        username: keycloak
        # -- Password
        password: keycloak
        # -- Credentials stored in a secret
        secret:
          # -- Using the secret for the credentials
          enabled: false
          # -- Name of the secret
          # -- The secret is expected to have the following keys: username & password
          name: keycloak-postgresql
          # -- Using an external secret
          externalSecret:
            # -- Creating the external secret definition
            enabled: false
            # -- Refresh interval
            refreshInterval: 6h
            # -- Location of the secret to bind to
            store:
              # -- Name of the secret store
              name: vault-backend
              # -- Scope of the secret store
              kind: ClusterSecretStore
              # -- Path to the secret in the store.
              # -- The entry is expected to have the following keys: username & password
              path: ontrack/keycloak/postgres
      # -- Postgres service
      service:
        # -- Service type
        type: ClusterIP
  # -- Unique secret used by Next Auth in Yontrack to create session cookies
  next:
    # -- Secret definition
    secret:
      # -- Name of the secret
      # The secret must have an `secret` entry
      name: ontrack-next-auth
      # -- Generating the secret
      generate: true
      # -- Using an external secret
      externalSecret:
        # -- Creating the external secret definition
        enabled: false
        # -- Refresh interval
        refreshInterval: 6h
        # -- Location of the secret to bind to
        store:
          # -- Name of the secret store
          name: vault-backend
          # -- Scope of the secret store
          kind: ClusterSecretStore
          # -- Path to the secret in the store.
          # -- The entry is expected to have the following keys: username & password
          path: ontrack/next-auth
  # Specific setup for parsing the JWT access tokens
  # jwt:
    # Enabling debugging in Yontrack
    # debug: false
    # Audience
    # audience: ""
    # If the `typ` claim is different than "JWT"
    # type: JWT
    # List of mappings for the claims
    # claims:
      # Claim that contains the email
      # email: email

# -- Local database
postgresql:
  image:
    # -- See the announcement at https://hub.docker.com/r/bitnami/rabbitmq
    repository: bitnamilegacy/postgresql
  # -- Enabling the local database
  local: true
  # -- Authentication parameters
  auth:
    # -- Name of the database to create
    database: ontrack
    # -- Credentials to be used
    username: ontrack
    # -- Credentials to be used
    password: ontrack
  # Configuration for the container database
#  primary:
#    pgHbaConfiguration: |-
#      host all all 0.0.0.0/0 trust
  # -- For external database
  postgresqlUrl: ""
  # -- For external database, using environment variables
  postgresFromEnv: false

# -- Local database
keycloak-postgresql:
  image:
    # -- See the announcement at https://hub.docker.com/r/bitnami/rabbitmq
    repository: bitnamilegacy/postgresql
  # -- Authentication parameters
  auth:
    # -- Name of the database to create
    database: keycloak
    # -- Credentials to be used
    username: keycloak
    # -- Credentials to be used
    password: keycloak

# -- Local RabbitMQ for message processing
rabbitmq:
  image:
    # See the announcement at https://hub.docker.com/r/bitnami/rabbitmq
    repository: bitnamilegacy/rabbitmq
  auth:
    username: ontrack
    password: ontrack
    erlangCookie: ontrack

# External Elasticsearch, only used for the optional export of the metrics.
# Since 6.0, the chart no longer bundles Elasticsearch: Yontrack searches in Postgres.
elasticsearch:
  metrics:
    # -- Enabling the export of the metrics to Elasticsearch
    enabled: false
    # -- Name of the Elasticsearch index for the metrics
    index: ontrack_metrics
  # -- URIs of the Elasticsearch cluster (comma-separated), required when the metrics export is enabled
  uris: ""
  # -- Username to connect to Elasticsearch
  username: ""
  # -- Name of an existing secret holding the password to connect to Elasticsearch
  existingSecret: ""
  # -- Key of the password in the existing secret
  existingSecretPasswordKey: password

# Audit trail (Yontrack 6)
auditTrail:
  # Storage of the evidence, in an S3-compatible bucket.
  # The storage is configured when an endpoint is set. Leave these values empty when using the bundled MinIO.
  storage:
    # -- S3 endpoint, like https://s3.<region>.amazonaws.com or https://<region>.digitaloceanspaces.com
    endpoint: ""
    # -- Name of the bucket, which must exist
    bucket: ""
    # -- Region of the bucket
    region: us-east-1
    # -- Path-style access to the bucket (true for MinIO)
    pathStyle: false
    # -- Maximum size of an evidence file, like 50MB. When empty, Yontrack's default applies (50MB).
    maxSize: ""
    # -- Name of an existing secret holding the access & secret keys
    existingSecret: ""
    # -- Key of the access key in the secret
    accessKeyKey: accessKey
    # -- Key of the secret key in the secret
    secretKeyKey: secretKey
  # Bundled MinIO-compatible storage (Silo, the community fork of MinIO), with its bucket created at start.
  # When enabled, Yontrack uses it: auditTrail.storage.endpoint, bucket & existingSecret must then be left empty.
  minio:
    # -- Deploying a MinIO-compatible storage for the evidence
    enabled: false
    image:
      # -- Image of the MinIO-compatible server (Silo, the community fork of MinIO, which no longer publishes images)
      repository: pgsty/silo
      # -- Version of the image
      tag: "RELEASE.2026-09-16T00-00-00Z"
      # -- Pull policy
      pullPolicy: IfNotPresent
    # -- Name of the bucket to create
    bucket: yontrack-audit-trail
    # -- Name of an existing secret holding the root user & password. When empty, they are generated.
    existingSecret: ""
    # -- Key of the root user in the secret
    rootUserKey: rootUser
    # -- Key of the root password in the secret
    rootPasswordKey: rootPassword
    persistence:
      # -- Size of the volume
      size: 10Gi
      # -- Access mode of the volume
      accessMode: ReadWriteOnce
      # -- Storage class of the volume ("-" for none, empty for the default one)
      storageClass: ""
      # -- Annotations of the PVC
      annotations: {}
    # -- Resources of the MinIO container
    resources: {}

# -- In case you want to specify different resources for emptyDir than {}
emptyDir: { }
  # Example of resouces that might be used:
  # medium: Memory
# sizeLimit: 16Mi

# -- Array of extra containers to run alongside the Yontrack container
#
# Example:
# - name: myapp-container
#   image: busybox
#   command: ['sh', '-c', 'echo Hello && sleep 3600']
#
extraContainers: [ ]
