{{- include "ontrack.elasticsearch.validate" . }}
{{- include "ontrack.middleware.validate" . }}
{{- include "ontrack.upgrades.validate" . }}
{{- include "ontrack.database.validate" . }}
{{- $zdu := .Values.ontrack.zeroDowntimeUpgrades }}
{{- $useEmptyDir := and $zdu (not .Values.ontrack.persistence.ephemeral.enabled) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontrack.fullname" . }}
  labels:
    {{- include "ontrack.labels" . | nindent 4 }}
  {{- if $zdu }}
  annotations:
    # Rolled out before the UI, which may call it as soon as it is ready
    argocd.argoproj.io/sync-wave: "0"
  {{- end }}
spec:
  replicas: {{ .Values.ontrack.replicas }}
  strategy:
    {{- if $zdu }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # One pod at a time on the data PVC
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ontrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with merge (deepCopy .Values.ontrack.podAnnotations | default (dict)) (deepCopy .Values.podAnnotations | default (dict)) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ontrack.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontrack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $zdu }}
      # Longer than the graceful shutdown phase of Yontrack (45 s), after the preStop delay
      terminationGracePeriodSeconds: 60
      {{- end }}
      containers:
      {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
      {{- end }}
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            {{- include "ontrack.backend.volumeMounts" . | nindent 12 }}
          env:
            {{- include "ontrack.backend.env" . | nindent 12 }}
          envFrom:
            {{- include "ontrack.backend.envFrom" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mgt
              containerPort: 8800
              protocol: TCP
          {{- $resources := deepCopy (.Values.ontrack.resources | default (dict)) }}
          {{- if $useEmptyDir }}
          {{- $_ := set $resources "requests" (merge (dict "ephemeral-storage" .Values.ontrack.persistence.size) ($resources.requests | default (dict))) }}
          {{- end }}
          resources: {{ toYaml $resources | nindent 12 }}
          {{- if $zdu }}
          lifecycle:
            # Lets the endpoints be withdrawn before Yontrack stops accepting connections
            preStop:
              exec:
                command: ["sleep", "10"]
          {{- end }}
          startupProbe:
            httpGet:
              path: /manage/health/readiness
              port: mgt
            {{- with .Values.ontrack.probes.startup }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /manage/health/liveness
              port: mgt
            {{- with .Values.ontrack.probes.liveness }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /manage/health/readiness
              port: mgt
            {{- if $zdu }}
            # Gated by the startup probe; the pod is withdrawn from the service within 10 s
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: {{ dig "timeoutSeconds" 5 (.Values.ontrack.probes.readiness | default (dict)) }}
            failureThreshold: 2
            successThreshold: 1
            {{- else }}
            {{- with .Values.ontrack.probes.readiness }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
            {{- end }}
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- with include "ontrack.topologySpreadConstraints" (dict "replicas" .Values.ontrack.replicas "spread" .Values.ontrack.topologySpread "selectorLabels" (include "ontrack.selectorLabels" .)) }}
      {{- . | nindent 6 }}
      {{- end }}
      volumes:
        - name: ontrack
          {{- if $useEmptyDir }}
          emptyDir:
            sizeLimit: {{ .Values.ontrack.persistence.size | quote }}
          {{- else if $zdu }}
          # One volume per pod, deleted with it: it only holds Git clones
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: {{ .Values.ontrack.persistence.size | quote }}
                {{- if .Values.ontrack.persistence.storageClass }}
                {{- if (eq "-" .Values.ontrack.persistence.storageClass) }}
                storageClassName: ""
                {{- else }}
                storageClassName: "{{ .Values.ontrack.persistence.storageClass }}"
                {{- end }}
                {{- end }}
          {{- else if .Values.ontrack.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ontrack.fullname" . }}
          {{- else }}
          emptyDir: {{- toYaml .Values.emptyDir | nindent 12 }}
          {{- end  }}
        {{- include "ontrack.backend.configVolumes" . | nindent 8 }}
