{{- if .Values.rabbitmq.local }}
{{- $name := include "ontrack.rabbitmq.fullname" . }}
# Headless Service governing the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "ontrack.labels.rabbitmq" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
  selector:
    {{- include "ontrack.selectorLabels.rabbitmq" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ontrack.labels.rabbitmq" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
  selector:
    {{- include "ontrack.selectorLabels.rabbitmq" . | nindent 4 }}
{{- end }}
