{{- if .Values.postgresql.local }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontrack.postgresql.fullname" . }}
  labels:
    {{- include "ontrack.labels.postgresql" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}
