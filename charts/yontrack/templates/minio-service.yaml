{{- if .Values.auditTrail.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontrack.minio.fullname" . }}
  labels:
    {{- include "ontrack.labels.minio" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ontrack.selectorLabels.minio" . | nindent 4 }}
  ports:
    - protocol: TCP
      name: s3
      port: 9000
      targetPort: s3
{{- end }}
