{{- if .Values.rabbitmq.local }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontrack.rabbitmq.fullname" . }}
  labels:
    {{- include "ontrack.labels.rabbitmq" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.rabbitmq.auth.username | b64enc | quote }}
  password: {{ .Values.rabbitmq.auth.password | b64enc | quote }}
  rabbitmq.conf: {{ include "ontrack.rabbitmq.config" . | b64enc | quote }}
{{- end }}
