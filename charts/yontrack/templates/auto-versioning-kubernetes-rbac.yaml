{{- if and .Values.autoVersioning.kubernetes.enabled .Values.autoVersioning.kubernetes.rbac.create }}
# Permissions of the Yontrack backend on the Jobs of the Kubernetes post-processing of auto-versioning
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ontrack.fullname" . }}-av-kubernetes
  namespace: {{ include "ontrack.autoVersioning.kubernetes.namespace" . }}
  labels:
    {{- include "ontrack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Credentials of the Jobs, owned by them
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ontrack.fullname" . }}-av-kubernetes
  namespace: {{ include "ontrack.autoVersioning.kubernetes.namespace" . }}
  labels:
    {{- include "ontrack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ontrack.fullname" . }}-av-kubernetes
subjects:
  - kind: ServiceAccount
    name: {{ include "ontrack.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
