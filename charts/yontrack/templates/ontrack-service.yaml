{{- include "ontrack.management.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontrack.fullname" . }}
  labels:
    {{- include "ontrack.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.service.annotations | default (dict)) }}
  {{- if .Values.ontrack.zeroDowntimeUpgrades }}
  {{- $_ := set $annotations "argocd.argoproj.io/sync-wave" "0" }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
    {{- if not .Values.management.service.specific }}
    - port: {{ .Values.management.service.port }}
      targetPort: 8800
      protocol: TCP
      name: mgt
    {{- end }}
  selector:
    {{- include "ontrack.selectorLabels" . | nindent 4 }}
