{{- if and (eq "keycloak" .Values.auth.kind) (not .Values.auth.keycloak.external.enabled) }}
{{- $persistence := .Values.auth.keycloak.persistence }}
{{- $connection := $persistence.connection }}
{{- $credentials := dict "username" $connection.username "password" $connection.password }}
{{- if $connection.secret.enabled }}
{{- $credentials = dict "secret" $connection.secret.name "usernameKey" "username" "passwordKey" "password" }}
{{- end }}
{{- /* Data in the postgresql folder of the volume, never in its postgres folder, where the versions on the official
image (2025-12) may have left a stale database: the Bitnami image of the later ones did not persist anything (#183) */}}
{{- include "ontrack.postgres.statefulset" (dict
    "root" .
    "name" (printf "%s-keycloak-postgres" (include "ontrack.fullname" .))
    "serviceName" "keycloak-postgres"
    "labels" (include "ontrack.labels.keycloak.postgres" .)
    "selectorLabels" (include "ontrack.selectorLabels.keycloak.postgres" .)
    "configMap" (printf "%s-keycloak-postgres-configuration" (include "ontrack.fullname" .))
    "configData" (include "ontrack.keycloak.postgres.configData" .)
    "image" $persistence.image
    "database" $connection.database
    "credentials" $credentials
    "claimName" (printf "%s-keycloak-postgres-pvc" (include "ontrack.fullname" .))
    "subPath" "postgresql"
    "resources" $persistence.resources
    "nodeSelector" .Values.nodeSelector
    "tolerations" .Values.tolerations
    "affinity" .Values.affinity
    "podAnnotations" .Values.podAnnotations
) }}
{{- end }}
