version: v1
configuration:
  defaults:
    branch:
      validations:
        build: {}
        upgrade-rolling: {}
        upgrade-default: {}
        upgrade-ha: {}
        release: {}
      promotions:
        BRONZE:
          validations:
            - build
            - upgrade-rolling
            - upgrade-default
            - upgrade-ha
        RELEASE:
          validations:
            - build
            - release
      autoVersioning:
        configurations:
          - sourceProject: yontrack
            sourceBranch: main
            sourcePromotion: RELEASE
            targetPath: charts/yontrack/Chart.yaml
            targetRegex: '^appVersion: "(.*)"$'
            validationStamp: auto
            prTitleTemplate: "chore: Using Yontrack ${VERSION}"
            prBodyTemplateFormat: markdown
            prBodyTemplate: |
              ${av.changelog?commitsOption=OPTIONAL&empty=No changelog&title=true}
    build:
      autoVersioningCheck: true
