name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Yontrack configuration
        id: yontrack-config
        uses: nemerosa/ontrack-github-actions-cli-config@v1.0.3
        env:
          YONTRACK_URL: ${{ vars.YONTRACK_URL }}
          YONTRACK_TOKEN: ${{ secrets.YONTRACK_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Preparing theme
        run: |
          cd charts/yontrack/files/themes
          tar vczf yontrack.tar.gz yontrack

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Helm dependencies repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add elastic https://helm.elastic.co

      - name: Linting
        run: |
          helm lint charts/yontrack

      - name: Template tests
        run: |
          chmod +x scripts/test-templates.sh
          ./scripts/test-templates.sh

      - name: Image check
        run: |
          chmod +x scripts/check-images.sh
          ./scripts/check-images.sh

      - name: Packaging
        id: packaging
        run: |
          helm package charts/yontrack

      - name: Yontrack build
        if: ${{ steps.packaging.outcome != '' }}
        run: |
          yontrack validate --validation build --status ${{ steps.packaging.outcome == 'success' && 'PASSED' || 'FAILED' }}

      - name: Checking if the current version is already released
        id: release
        if: ${{ steps.packaging.outcome != '' }}
        run: |
          CURRENT_RELEASE=$(cat charts/yontrack/Chart.yaml | yq -r .version)
          echo "Current release: $CURRENT_RELEASE"
          # The GitHub release is the source of truth, whatever the branch
          if OUTPUT=$(gh release view "$CURRENT_RELEASE" 2>&1); then
            RELEASED=true
          elif [[ "$OUTPUT" == *"release not found"* ]]; then
            RELEASED=false
          else
            echo "Cannot check the GitHub release: $OUTPUT"
            exit 1
          fi
          echo "Already released: $RELEASED"
          # Semver prerelease (6.0.0-alpha.0, ...)
          if [[ "$CURRENT_RELEASE" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "Prerelease: $PRERELEASE"
          echo "currentRelease=$CURRENT_RELEASE" >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publishing in Docker Hub (OCI)
        id: publish
        if: ${{ steps.release.outcome == 'success' && steps.release.outputs.released == 'false' }}
        run: |
          helm registry login registry-1.docker.io \
            --username "${{ secrets.DOCKER_HUB_USERNAME }}" \
            --password "${{ secrets.DOCKER_HUB_TOKEN }}"
          CHART_PACKAGE="$(ls yontrack-*.tgz)"
          helm push "$CHART_PACKAGE" oci://registry-1.docker.io/yontrack

      - name: Changelog since last release
        id: changelog
        if: ${{ steps.publish.outcome == 'success' }}
        run: |
          yontrack build changelog semantic --from-promotion RELEASE --emojis --issues > changelog.md

      - name: GitHub release
        if: ${{ steps.changelog.outcome == 'success' && steps.publish.outcome == 'success' }}
        run: |
          gh release create ${{ steps.release.outputs.currentRelease }} \
            --title "${{ steps.release.outputs.currentRelease }}" \
            --notes-file changelog.md \
            ${{ steps.release.outputs.prerelease == 'true' && '--prerelease' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Yontrack release
        if: ${{ steps.publish.outcome != '' && steps.publish.outcome != 'skipped' }}
        run: |
          yontrack build set-property release "${{ steps.release.outputs.currentRelease }}"
          yontrack validate --validation release --status ${{ steps.publish.outcome == 'success' && 'PASSED' || 'FAILED' }}
