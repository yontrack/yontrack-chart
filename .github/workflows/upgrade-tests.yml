name: Upgrade tests

# Upgrades the previous published chart to the chart of the commit, on a kind cluster (#151):
# - rolling: `ontrack.zeroDowntimeUpgrades: true`, under load, fails on any failed request, and checks
#   that the hook Job runs the contract migration;
# - default: the pod comes back, and both migrations run at startup;
# - ha: as rolling, with two backends on two workers, then a node drain and the loss of a backend pod (#169).
# See scripts/upgrade-test.sh.
#
# On main, release.yml calls this workflow once it has registered the Yontrack build, and each mode is recorded
# on that build as the `upgrade-<mode>` validation (BRONZE, see .yontrack/ci.yaml).

on:
  push:
    # Tested by release.yml
    branches-ignore:
      - main
  pull_request:
  workflow_call:
    inputs:
      yontrack-project:
        description: Yontrack project of the build registered for the commit, to record the validations on
        type: string
        required: false
        default: ''

jobs:
  upgrade:
    # A branch of this repository is already tested by its push
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [ rolling, default, ha ]
    name: upgrade (${{ matrix.mode }})
    steps:
      - name: Job start
        id: job_start
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Yontrack build
        if: ${{ inputs.yontrack-project }}
        uses: nemerosa/ontrack-github-actions-cli-library/ontrack-cli-workflow-build@v1.0.3
        with:
          project: ${{ inputs.yontrack-project }}
          yontrack-url: ${{ vars.YONTRACK_URL }}
          yontrack-token: ${{ secrets.YONTRACK_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparing theme
        run: |
          chmod +x scripts/build-theme.sh
          ./scripts/build-theme.sh

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.3

      - name: Failure classification tests
        if: ${{ matrix.mode == 'rolling' }}
        run: |
          chmod +x scripts/upgrade-test/failures-test.sh
          ./scripts/upgrade-test/failures-test.sh

      # The cluster of each mode is created by the test (one or three nodes)
      - name: Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Upgrade test
        id: upgrade
        run: |
          chmod +x scripts/upgrade-test.sh
          ./scripts/upgrade-test.sh ${{ matrix.mode }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Yontrack validation
        if: ${{ !cancelled() && inputs.yontrack-project && (steps.upgrade.outcome == 'success' || steps.upgrade.outcome == 'failure') }}
        env:
          STARTED: ${{ steps.job_start.outputs.started }}
        run: |
          yontrack validate \
            --validation upgrade-${{ matrix.mode }} \
            --status ${{ steps.upgrade.outcome == 'success' && 'PASSED' || 'FAILED' }} \
            --run-time $(( $(date +%s) - STARTED ))

      - name: Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-test-${{ matrix.mode }}
          path: build/upgrade-test
          if-no-files-found: ignore
